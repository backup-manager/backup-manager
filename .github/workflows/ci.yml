name: Tests
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpspec:
    name: PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          - { php: '8.2', dependencies: lowest }

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ftp
          coverage: none

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Show resolved key packages
        run: composer show | grep -E '^(league/flysystem|phpspec/phpspec|symfony/process)'

      - name: Run tests
        run: ./vendor/bin/phpspec run -fpretty -v
